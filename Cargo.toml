[package]
name = "hyprhands"
version = "0.1.0"
edition = "2024"
description = "Computer-use executor for Wayland compositors, exposed over MCP"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
opt-level = "z"
lto = true
